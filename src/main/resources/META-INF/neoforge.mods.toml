modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

# This mod's optional hooks (docs/NATIVE_CHARACTER_COMPATIBILITY.md, "Hook contracts"). Every injection
# in it is string-targeted and optional; hook.HookPlugin counts which ones landed.
[[mixins]]
config="mcamobcompat.mixins.json"

# MCA: Mob Compatibility is meaningless without MCA Reborn, so MCA is a mandatory dependency.
# We load AFTER MCA so its entities and registries are present.
[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neoforge_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="mca"
    type="required"
    versionRange="${mca_version_range}"
    ordering="AFTER"
    side="BOTH"
# Architectury is deliberately NOT declared. This mod names no Architectury type, and MCA 7.7 for
# NeoForge 1.21.1 does not need it; MCA declares whatever it does need itself.

# Every entry below is OPTIONAL, and every version range is deliberately "[0,)" (= any version).
#
# "[0,)" rather than a tested floor because NeoForge enforces an optional dependency's versionRange when
# the mod IS present: a floor would refuse to launch for someone running an older build, for a mod we
# only ever touch through registry ids and datapack tags. There is nothing to be incompatible with --
# no class of theirs is referenced anywhere in this jar -- so the correct range is "any", and any
# genuine incompatibility is handled in Java by simply not classifying an entity.
#
# It must NOT be an empty string: Maven parses "" into a range with no restrictions, which contains
# no version at all, so the loader reports "only supports <mod>" the moment that mod is installed.
#
# ordering="AFTER" so their entity types and tags are registered before our setup runs.

# Guard Villagers. The reason this mod exists: its villager->guard conversion reaches MCA villagers
# and destroys their family/marriage/genetics data (see ConversionGuardHandler).
[[dependencies.${mod_id}]]
    modId="guardvillagers"
    type="optional"
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

# SWEM (Star Worm Equestrian Mod) -- swem:swem_horse, classified as horse + mount.
[[dependencies.${mod_id}]]
    modId="swem"
    type="optional"
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

# Genetic Animals. Note the mod id is "eanimod", NOT "geneticanimals": the jar's own mods.toml
# declares modId="eanimod" and its package root is mokiyoki.enhancedanimals. Its entities are
# eanimod:enhanced_cow, enhanced_pig, enhanced_sheep, and so on.
[[dependencies.${mod_id}]]
    modId="eanimod"
    type="optional"
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

# DragN's Livestock Overhaul -- the "O-Animals" (dragnlivestock:o_cow, o_pig, ...). DLO registers its
# animals into conventional entity-type tags, so most of our classification of it comes free through
# those.
[[dependencies.${mod_id}]]
    modId="dragnlivestock"
    type="optional"
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="icys_better_horses"
    type="optional"
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="alexsmobs"
    type="optional"
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

# Villager Recruits and Villager Workers are deliberately NOT declared: neither publishes a NeoForge
# 1.21.1 build, so their adapters report themselves unavailable on this platform (see
# integration/PlatformArtifacts) and there is nothing to order against.
