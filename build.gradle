plugins {
    id 'java-library'
    id 'idea'
    id 'eclipse'
    id 'net.neoforged.moddev' version '2.0.141'
}
version = "${mod_version}+${minecraft_version}"
group = mod_group_id
base { archivesName = "${mod_id}-neoforge" }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
sourceSets {
    main.resources.srcDir 'src/generated/resources'
    gameTest
    runtimeProbe
}
neoForge {
    version = project.neoforge_version
    runs {
        client { client(); gameDirectory = file('run-client') }
        server { server(); gameDirectory = file('run-server'); programArgument '--nogui' }
        // `gradlew runGameTestServer` runs every GameTest in the mcamobcompat namespace against the
        // real MCA and Guard Villagers. -PwithSwem, -PwithIcy, -PwithAlex (or -PwithAlexContinued)
        // and -PwithGolems add those mods and enable their own test namespaces; -PwithIcy116 loads
        // Icy's Better Horses 1.1.6 instead of 2.0, with the same suite.
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = file('run-gametest')
            sourceSet = sourceSets.gameTest
            systemProperty 'neoforge.enabledGameTestNamespaces', gameTestNamespaces()
        }
    }
    mods {
        "${mod_id}" { sourceSet sourceSets.main }
        mcamobcompat_tests { sourceSet sourceSets.gameTest }
    }
    unitTest { enable(); testedMod = mods."${mod_id}" }
}
/** The GameTest namespaces to enable: the core suite, plus one per optional mod flag. */
def gameTestNamespaces() {
    def namespaces = [mod_id]
    if (project.hasProperty('withSwem')) namespaces << 'mcamobcompat_swem'
    if (project.hasProperty('withIcy') || project.hasProperty('withIcy116')) namespaces << 'mcamobcompat_icy'
    if (project.hasProperty('withAlex') || project.hasProperty('withAlexContinued')) namespaces << 'mcamobcompat_alex'
    if (project.hasProperty('withGolems')) namespaces << 'mcamobcompat_golems'
    if (project.hasProperty('withCrime')) namespaces << 'mcamobcompat_crime'
    return namespaces.join(',')
}

// Villager Recruits and Villager Workers publish no NeoForge 1.21.1 build, so their suites
// (mcamobcompat_recruits, mcamobcompat_workers) run on the Forge 1.20.1 build only; asking for them here is
// an error rather than a run that silently tests nothing. Their adapters report themselves unavailable.
if (project.hasProperty('withRecruits') || project.hasProperty('withWorkers')) {
    throw new GradleException('Villager Recruits and Villager Workers have no NeoForge 1.21.1 build; their '
            + 'GameTest suites run on the Forge 1.20.1 build only.')
}

neoForge.addModdingDependenciesTo(sourceSets.gameTest)
neoForge.addModdingDependenciesTo(sourceSets.runtimeProbe)
repositories {
    maven { url = 'https://maven.conczin.net/Artifacts'; content { includeGroup 'net.conczin.mca' } }
    maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
    maven { url = 'https://cursemaven.com'; content { includeGroup 'curse.maven' } }
    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'; content { includeGroup 'software.bernie.geckolib' } }
}
configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
    gameTestImplementation.extendsFrom implementation
    gameTestRuntimeOnly.extendsFrom localRuntime
}
// Every MCA build McaBindingProbeTest replays the binding against, one configuration each (see
// mca_probe_versions in gradle.properties). Production NeoForge jars are mojmap like this dev runtime,
// so MCA's declarations read exactly as McaBinding names them. transitive=false keeps MCA's dependency
// graph out of the build.
ext.mcaProbeVersions = (project.findProperty('mcaProbeVersions') ?: mca_probe_versions)
        .toString().split(',').collect { it.trim() }.findAll { !it.isEmpty() }
mcaProbeVersions.eachWithIndex { version, i ->
    configurations.create("mcaProbe${i}") { canBeConsumed = false; transitive = false }
}
dependencies {
    localRuntime("net.conczin.mca:mca-neoforge:${mca_version}") { transitive = false }
    testRuntimeOnly("net.conczin.mca:mca-neoforge:${mca_version}") { transitive = false }
    // Guard Villagers is on every dev run and GameTest, as on Forge: every safety-critical behaviour
    // is about it. (-PwithGuards is accepted and changes nothing, for older command lines.)
    localRuntime("maven.modrinth:guard-villagers:${guard_version_id}") { transitive = false }

    // Optional mods and their libraries, for dev runs and GameTests only, one flag per mod. Pinned
    // in gradle.properties; runtime-only so that nothing can ever compile against them.
    if (project.hasProperty('withSwem') || project.hasProperty('withIcy116') || project.hasProperty('withCrime')) {
        localRuntime("software.bernie.geckolib:geckolib-neoforge-1.21.1:${dev_geckolib_version}") { transitive = false }
    }
    if (project.hasProperty('withSwem')) {
        localRuntime("curse.maven:swem-582697:${dev_swem_file}") { transitive = false }
        localRuntime("curse.maven:player-animator-658587:${dev_playeranimator_file}") { transitive = false }
    }
    if (project.hasProperty('withIcy')) {
        localRuntime("maven.modrinth:modonomicon:${dev_modonomicon_version}") { transitive = false }
        localRuntime("maven.modrinth:icys-better-horses:${dev_icys_better_horses_version}") { transitive = false }
    }
    if (project.hasProperty('withIcy116')) {
        localRuntime("maven.modrinth:icys-better-horses:${dev_icys_better_horses_116_version}") { transitive = false }
    }
    if (project.hasProperty('withAlex')) {
        localRuntime("maven.modrinth:XjY0RcQj:${dev_citadel_port_version}") { transitive = false }
        localRuntime("maven.modrinth:EmNhnNnt:${dev_alexsmobs_version}") { transitive = false }
    }
    if (project.hasProperty('withAlexContinued')) {
        localRuntime("maven.modrinth:codxlib:${dev_codxlib_version}") { transitive = false }
        localRuntime("maven.modrinth:alexs-mobs-continued:${dev_alexsmobs_continued_version}") { transitive = false }
    }
    if (project.hasProperty('withGolems')) {
        localRuntime("maven.modrinth:golemskillcreepers:${dev_golemskillcreepers_version}") { transitive = false }
    }
    // -PwithCrime -PcrimeJar=<path to a built NeoForge 1.21.1 MCA: Crime jar> runs the mcamobcompat_crime
    // suite: Crime's effects on a hidden proxy reach the guard. Crime is not a dependency of this mod.
    if (project.hasProperty('withCrime')) {
        def crimeJar = file(project.findProperty('crimeJar') ?: '')
        if (!crimeJar.isFile()) {
            throw new GradleException("-PwithCrime needs -PcrimeJar=<path to a built MCA: Crime jar>; got '${crimeJar}'.")
        }
        localRuntime files(crimeJar)
    }
    runtimeProbeImplementation sourceSets.main.output
    gameTestImplementation sourceSets.main.output
    // A plain version is an MCA Maven build; a Modrinth version id (no dots) is a build only Modrinth has.
    mcaProbeVersions.eachWithIndex { version, i ->
        add("mcaProbe${i}", version.contains('.') ? "net.conczin.mca:mca-neoforge:${version}"
                : "maven.modrinth:minecraft-comes-alive-reborn:${version}")
    }
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test {
    useJUnitPlatform()
    systemProperty 'mcamobcompat.projectDir', projectDir.absolutePath
    // The MCA jars travel as paths, not a classpath: McaBindingProbeTest opens each in its own
    // URLClassLoader behind a parent that hides the MCA this unit-test runtime already loads. Declared
    // as inputs so a fleet change re-runs the suite; the property is set in doFirst, at execution time.
    inputs.files(mcaProbeVersions.indices.collect { i -> configurations.getByName("mcaProbe${i}") })
            .withPropertyName('mcaProbeJars')
    doFirst {
        systemProperty 'mcamobcompat.probe.jars', mcaProbeVersions.indices
                .collect { i -> configurations.getByName("mcaProbe${i}").files }
                .flatten()
                .join(File.pathSeparator)
    }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
tasks.named('processResources', ProcessResources) {
    def props = ['minecraft_version_range', 'neoforge_version_range', 'loader_version_range',
                 'mod_id', 'mod_name', 'mod_license', 'mod_version', 'mod_authors', 'mod_description', 'mca_version_range']
            .collectEntries { [(it): project.property(it)] }
    props.mod_version = project.version
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') { expand props }
}

tasks.register('checkJarContents') {
    dependsOn tasks.named('jar')
    doLast {
        def forbidden = ['tallestegg/guardvillagers/', 'com/alaharranhonor/swem/',
                         'mokiyoki/enhancedanimals/', 'com/dragn0007/dragnlivestock/',
                         'icy/betterhorses/', 'com/github/alexthe666/', 'codx/codxlib/',
                         'dev/terminalmc/golemskillcreepers/', 'com/talhanation/',
                         'neoforge/net/mca/', 'neoforge/net/conczin/mca/', 'forge/net/mca/', 'net/mca/', 'forge/net/conczin/mca/',
                         'net/conczin/mca/', 'dev/architectury/',
                         // The GameTest mod is its own source set and must never reach this jar.
                         'dev/otectus/mcamobcompat/gametest/']
        // Slash form is a real class reference, and no class may hold one, allowlisted or not.
        def forbiddenBytes = ['forge/net/mca', 'net/conczin/mca', 'net/mca/',
                              'tallestegg/guardvillagers', 'com/alaharranhonor/swem',
                              'mokiyoki/enhancedanimals', 'com/dragn0007/dragnlivestock', 'com/dragn0007',
                              'icy/betterhorses', 'com/github/alexthe666', 'codx/codxlib',
                              'dev/terminalmc/golemskillcreepers', 'dev/architectury', 'com/talhanation',
                              // Optional mods' dotted names that no class may hold at all.
                              'tallestegg.guardvillagers', 'com.alaharranhonor.swem',
                              'mokiyoki.enhancedanimals', 'com.dragn0007', 'icy.betterhorses',
                              'com.github.alexthe666', 'codx.codxlib', 'dev.terminalmc.golemskillcreepers',
                              'dev.architectury']
        // Dotted form is a Class.forName or Mixin target name. Each root may appear only in the exact
        // class files listed -- the reflective bindings and the optional hooks -- and no prefix matches.
        def dottedAllowlist = [
                'forge.net.mca'           : ['dev/otectus/mcamobcompat/mca/McaBinding.class',
                                             'dev/otectus/mcamobcompat/hook/mixin/McaEditorSaveHook.class'],
                'net.conczin.mca'         : ['dev/otectus/mcamobcompat/mca/McaBinding.class',
                                             'dev/otectus/mcamobcompat/hook/mixin/McaEditorSaveHook.class'],
                'net.mca.'                : ['dev/otectus/mcamobcompat/mca/McaBinding.class',
                                             'dev/otectus/mcamobcompat/hook/mixin/McaEditorSaveHook.class'],
                'com.talhanation.recruits': ['dev/otectus/mcamobcompat/integration/recruits/RecruitsBinding.class',
                                             'dev/otectus/mcamobcompat/hook/mixin/RecruitsConversionHook.class'],
                'com.talhanation.workers' : ['dev/otectus/mcamobcompat/integration/workers/WorkersBinding.class'],
        ]
        def allowlisted = dottedAllowlist.values().flatten() as Set

        def jarFile = tasks.named('jar').get().archiveFile.get().asFile
        def offenders = []
        def linked = []
        def allowlistSeen = [] as Set
        new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
            zip.entries().each { entry ->
                if (forbidden.any { entry.name.startsWith(it) }) {
                    offenders << entry.name
                }
                if (entry.name.startsWith('dev/otectus/mcamobcompat/') && entry.name.endsWith('.class')) {
                    def text = new String(zip.getInputStream(entry).bytes, 'ISO-8859-1')
                    if (allowlisted.contains(entry.name)) {
                        allowlistSeen << entry.name
                    }
                    forbiddenBytes.each { root ->
                        if (text.contains(root)) {
                            linked << "${entry.name} -> ${root}"
                        }
                    }
                    dottedAllowlist.each { root, classes ->
                        if (text.contains(root) && !classes.contains(entry.name)) {
                            linked << "${entry.name} -> ${root}"
                        }
                    }
                }
            }
        }
        if (!offenders.isEmpty()) {
            throw new GradleException("Shaded classes found in ${jarFile.name}: ${offenders.take(20)}")
        }
        if (!linked.isEmpty()) {
            throw new GradleException("Class(es) in ${jarFile.name} name MCA or an optional mod: "
                    + "${linked.take(20)}. Reflective access and hook targets belong in the allowlisted "
                    + "classes alone; see NoOptionalModStaticLinkTest.")
        }
        // A dead exemption is worse than none: it would silently cover nothing while looking safe.
        def missing = allowlisted - allowlistSeen
        if (!missing.isEmpty()) {
            throw new GradleException("Allowlisted class(es) missing from ${jarFile.name}: ${missing}. "
                    + "Update both this list and NoOptionalModStaticLinkTest.DOTTED_ALLOWLIST.")
        }
        logger.lifecycle("checkJarContents: ${jarFile.name} is clean (no shaded MCA/optional-mod classes, "
                + "no foreign package names outside the ${allowlisted.size()}-class allowlist).")
    }
}


tasks.register('verifyProductionJar') {
    dependsOn 'jar'
    doLast {
        def jarFile = tasks.jar.archiveFile.get().asFile
        new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
            def meta = zip.getEntry('META-INF/neoforge.mods.toml')
            if (meta == null) throw new GradleException('Missing NeoForge metadata')
            def text = zip.getInputStream(meta).getText('UTF-8')
            if (text.contains('$' + '{') || !text.contains(project.version.toString()) || !text.contains('neoforge'))
                throw new GradleException('Invalid or unexpanded metadata')
            ['cattle', 'guard', 'horse', 'humanoid_npc', 'livestock', 'mca_villagers', 'mount', 'npc_threats',
             'pet', 'pig', 'player_only_mounts', 'poultry', 'sheep'].each {
                if (zip.getEntry("data/mcamobcompat/tags/entity_type/${it}.json") == null)
                    throw new GradleException("Missing entity tag ${it}")
            }
            ['assets/mcamobcompat/lang/en_us.json', 'pack.mcmeta', 'mcamobcompat.mixins.json',
             'dev/otectus/mcamobcompat/hook/mixin/McaEditorSaveHook.class',
             'dev/otectus/mcamobcompat/hook/mixin/RecruitsConversionHook.class',
             'dev/otectus/mcamobcompat/hook/HookPlugin.class'].each {
                if (zip.getEntry(it) == null) throw new GradleException("Missing resource ${it}")
            }
            // The optional hooks are declared in the mod metadata on NeoForge, not in the manifest.
            if (!text.contains('config="mcamobcompat.mixins.json"'))
                throw new GradleException('neoforge.mods.toml does not declare the hook config ([[mixins]])')
            def hooks = zip.getInputStream(zip.getEntry('mcamobcompat.mixins.json')).getText('UTF-8')
            if (hooks.contains('"refmap"') || !hooks.contains('"required": false'))
                throw new GradleException('mcamobcompat.mixins.json must be optional and need no refmap')
            zip.entries().each { entry ->
                if (entry.name.endsWith('.jar') || entry.name.contains('entity_types/') || entry.name == 'META-INF/mods.toml'
                        || entry.name.contains('/gametest/') || entry.name.contains('/probe/') || entry.name.endsWith('Test.class'))
                    throw new GradleException("Unexpected production entry ${entry.name}")
                if (entry.name.endsWith('.class')) {
                    byte[] bytes = zip.getInputStream(entry).bytes
                    int major = (bytes[6] & 255) * 256 + (bytes[7] & 255)
                    if (major != 65) throw new GradleException("Non-Java-21 class: ${entry.name}")
                    def symbols = new String(bytes, 'ISO-8859-1')
                    if (symbols.contains('net/minecraftforge') || symbols.contains('net.minecraftforge'))
                        throw new GradleException("Legacy Forge reference: ${entry.name}")
                }
            }
        }
        logger.lifecycle("Verified production jar: ${jarFile.name}")
    }
}
tasks.register('installMod') {
    group = 'build'
    description = 'Copies the verified NeoForge jar into -PmodsDir=<dir> (or $MCAMOBCOMPAT_MODS_DIR).'
    dependsOn 'checkJarContents', 'verifyProductionJar'
    def builtJar = tasks.named('jar', Jar).flatMap { it.archiveFile }
    def target = (project.findProperty('modsDir') ?: System.getenv('MCAMOBCOMPAT_MODS_DIR'))?.toString()
    inputs.file(builtJar)
    doLast {
        if (!target) {
            throw new GradleException("No mods folder given. Pass -PmodsDir=<path to your instance's mods " +
                    "folder> or set the MCAMOBCOMPAT_MODS_DIR environment variable.")
        }
        def modsDir = file(target)
        if (!modsDir.isDirectory()) {
            throw new GradleException("Mods folder does not exist: ${modsDir}")
        }
        def source = builtJar.get().asFile
        modsDir.listFiles({ f -> f.name ==~ /^${mod_id}-.*\.jar$/ && f.name != source.name } as FileFilter)
                ?.each { logger.warn("WARNING: ${it.name} is still in ${modsDir}; remove it, or NeoForge will refuse " +
                        "to load two copies of ${mod_id}.") }
        java.nio.file.Files.copy(source.toPath(), new File(modsDir, source.name).toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        logger.lifecycle("Installed ${source.name} to ${modsDir}.")
    }
}


tasks.named('check') { dependsOn 'checkJarContents', 'verifyProductionJar' }
tasks.named('build') { dependsOn 'checkJarContents', 'verifyProductionJar' }

// A GameTest server that fails to start -- a missing dependency, a mixin error -- still exits 0,
// which would pass for a green run. So the run is judged by the server's own summary line instead.
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doLast {
        def log = file('run-gametest/logs/latest.log')
        if (!log.exists()) {
            throw new GradleException("No GameTest log at ${log}; the server did not start.")
        }
        def text = log.getText('UTF-8')
        def passed = text =~ /All (\d+) required tests passed/
        if (!passed.find()) {
            def failed = text =~ /(\d+) required tests failed/
            throw new GradleException(failed.find()
                    ? "${failed.group(1)} required GameTest(s) failed; see ${log}."
                    : "The GameTest server never reported a result (did it fail to load?); see ${log}.")
        }
        logger.lifecycle("GameTests: all ${passed.group(1)} required tests passed.")
    }
}

// Optional, separately packaged validation driver. Never included by build, jar, or installMod.
tasks.register('runtimeProbeJar', Jar) {
    archiveClassifier = 'runtime-probe'
    from sourceSets.runtimeProbe.output
}
