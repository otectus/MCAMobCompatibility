plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

// <version>+<minecraft>, and a loader in the archive name, exactly as the NeoForge build names its
// jar: mcamobcompat-forge-0.2.1+1.20.1.jar beside mcamobcompat-neoforge-0.2.1+1.21.1.jar.
version = "${mod_version}+${minecraft_version}"
group = mod_group_id

base {
    archivesName = "${mod_id}-forge"
}

// Minecraft 1.18+ ships Java 17; target it explicitly (system default JDK may be newer).
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

// GameTests live in their own source set and their own development-only mod, so nothing in them
// can reach the shipped jar (checkJarContents also refuses the package outright).
sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    // An opt-in production validation driver for disposable test worlds, packaged on its own by
    // runtimeProbeJar. Never part of the release jar, build or installMod.
    runtimeProbe {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    gameTestImplementation.extendsFrom implementation
    gameTestRuntimeOnly.extendsFrom runtimeOnly
    runtimeProbeImplementation.extendsFrom implementation
}


minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            // MCA's mixins ship without a refmap and name Minecraft members by their SRG names,
            // which a dev run (official names) cannot resolve. Remapping mixin references through
            // ForgeGradle's SRG-to-official table is what lets MCA, and so every dev run and
            // GameTest here, start at all.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            // This mod's own optional hooks (docs/NATIVE_CHARACTER_COMPATIBILITY.md, "Hook contracts").
            // A jar declares them in its manifest; a dev run reads classes from a directory, so the
            // config is named here.
            args '-mixin.config=mcamobcompat.mixins.json'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        // `gradlew runGameTestServer` runs every GameTest in the mcamobcompat namespace against the
        // real MCA and Guard Villagers, and exits non-zero if any fails. -PwithSwem, -PwithIcy,
        // -PwithAlex and -PwithGolems add those mods and enable their own test namespaces.
        gameTestServer {
            workingDirectory project.file('run-gametest')
            property 'forge.enabledGameTestNamespaces', gameTestNamespaces()
            mods {
                mcamobcompat_tests {
                    source sourceSets.gameTest
                }
            }
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

/** The GameTest namespaces to enable: the core suite, plus one per optional mod flag. */
def gameTestNamespaces() {
    def namespaces = [mod_id]
    if (project.hasProperty('withSwem')) namespaces << 'mcamobcompat_swem'
    if (project.hasProperty('withIcy')) namespaces << 'mcamobcompat_icy'
    if (project.hasProperty('withAlex')) namespaces << 'mcamobcompat_alex'
    if (project.hasProperty('withGolems')) namespaces << 'mcamobcompat_golems'
    if (project.hasProperty('withCrime')) namespaces << 'mcamobcompat_crime'
    if (project.hasProperty('withRecruits') || project.hasProperty('withWorkers')) namespaces << 'mcamobcompat_recruits'
    if (project.hasProperty('withWorkers')) namespaces << 'mcamobcompat_workers'
    return namespaces.join(',')
}

repositories {
    // Architectury API (hard runtime dependency of MCA Reborn's Forge build).
    maven { url = 'https://maven.architectury.dev/' }

    // MCA Reborn via Modrinth Maven. exclusiveContent keeps this repo scoped to the
    // maven.modrinth group and routes resolution through ForgeGradle's deobf pipeline.
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        forRepositories(fg.repository)
        filter { includeGroup 'maven.modrinth' }
    }
}

// ---------------------------------------------------------------------------------------------
// Runtime mods for dev runs and GameTests.
//
// Every third-party mod jar here is a production jar: Minecraft members are named by SRG name, and
// its mixins name them the same way -- in @Shadow declarations, and for Loom/Forgix-built mods such
// as MCA directly in the annotations, with no refmap. fg.deobf remaps bytecode references but not
// those, so such a mod cannot start in a dev runtime at all. remapDevMods writes a development copy
// of each jar with every SRG member name (m_123_ / f_123_) rewritten to its official name -- in
// class constant pools, refmaps and access transformers alike -- using ForgeGradle's own
// SRG-to-official table. The copies live in build/devmods, are never shipped, and are never a
// compile dependency: runtimeOnly, from the devModSource configuration alone.
def devModsDir = layout.buildDirectory.dir('devmods')
def mcaDevVersion = project.hasProperty('mcaDev77') ? mca_version_77 : mca_version
configurations {
    devModSource { transitive = false }
}

// Every MCA build McaBindingProbeTest replays the binding against, one configuration each (see
// mca_probe_versions in gradle.properties; the family-wide list every sibling add-on probes). Raw
// production jars, deliberately not remapped: MCA's own member names are unobfuscated and Minecraft
// class names are official in a production jar, which is all McaBinding names. transitive=false keeps
// MCA's dependency graph out of the build.
ext.mcaProbeVersions = (project.findProperty('mcaProbeVersions') ?: mca_probe_versions)
        .toString().split(',').collect { it.trim() }.findAll { !it.isEmpty() }
mcaProbeVersions.eachWithIndex { version, i ->
    configurations.create("mcaProbe${i}") {
        canBeConsumed = false
        transitive = false
    }
}
// The audited Villager Recruits and Villager Workers jars, for the binding and hook-target probes
// (RecruitsBindingProbeTest, WorkersBindingProbeTest). Raw production jars, never on any classpath.
configurations {
    nativeModProbe {
        canBeConsumed = false
        transitive = false
    }
}

/** Rewrites every SRG member name (m_123_ / f_123_) in one class file's constant pool. */
static byte[] remapSrgMembers(byte[] bytes, Map<String, String> names, java.util.regex.Pattern srg) {
    def input = new DataInputStream(new ByteArrayInputStream(bytes))
    def buffer = new ByteArrayOutputStream(bytes.length + 256)
    def output = new DataOutputStream(buffer)
    output.writeInt(input.readInt())
    output.writeShort(input.readUnsignedShort())
    output.writeShort(input.readUnsignedShort())
    int count = input.readUnsignedShort()
    output.writeShort(count)
    boolean changed = false
    for (int i = 1; i < count; i++) {
        int tag = input.readUnsignedByte()
        output.writeByte(tag)
        switch (tag) {
            case 1:
                String text = input.readUTF()
                String renamed = text.replaceAll(srg) { String match -> names.getOrDefault(match, match) }
                changed |= renamed != text
                output.writeUTF(renamed)
                break
            case 3: case 4:
                output.writeInt(input.readInt()); break
            case 5: case 6:
                output.writeLong(input.readLong()); i++; break
            case 7: case 8: case 16: case 19: case 20:
                output.writeShort(input.readUnsignedShort()); break
            case 9: case 10: case 11: case 12: case 17: case 18:
                output.writeShort(input.readUnsignedShort()); output.writeShort(input.readUnsignedShort()); break
            case 15:
                output.writeByte(input.readUnsignedByte()); output.writeShort(input.readUnsignedShort()); break
            default:
                throw new GradleException("Unknown constant-pool tag ${tag}")
        }
    }
    output.write(input.readAllBytes())
    return changed ? buffer.toByteArray() : bytes
}

tasks.register('remapDevMods') {
    description = 'Builds dev-runtime copies of the third-party mod jars with SRG names rewritten to official names.'
    dependsOn 'createSrgToMcp'
    def srgToMcp = layout.buildDirectory.file('createSrgToMcp/output.srg')
    inputs.files(configurations.devModSource)
    inputs.file(srgToMcp)
    outputs.dir(devModsDir)
    doLast {
        Map<String, String> names = [:]
        srgToMcp.get().asFile.eachLine { String line ->
            def parts = line.split(' ')
            if (line.startsWith('MD: ') && parts.length == 5) {
                names[parts[1].substring(parts[1].lastIndexOf('/') + 1)] = parts[3].substring(parts[3].lastIndexOf('/') + 1)
            } else if (line.startsWith('FD: ') && parts.length == 3) {
                names[parts[1].substring(parts[1].lastIndexOf('/') + 1)] = parts[2].substring(parts[2].lastIndexOf('/') + 1)
            }
        }
        def srg = java.util.regex.Pattern.compile('(?<![A-Za-z0-9_$])[mf]_\\d+_(?![A-Za-z0-9_])')
        def outDir = devModsDir.get().asFile
        project.delete(outDir)
        outDir.mkdirs()
        configurations.devModSource.files.each { File source ->
            def target = new File(outDir, source.name.replaceAll(/\.jar$/, '-dev.jar'))
            int rewritten = 0
            new java.util.zip.ZipFile(source).withCloseable { zip ->
                new java.util.zip.ZipOutputStream(new FileOutputStream(target)).withCloseable { out ->
                    zip.entries().each { entry ->
                        byte[] bytes = zip.getInputStream(entry).bytes
                        if (entry.name.endsWith('.class')) {
                            byte[] remapped = remapSrgMembers(bytes, names, srg)
                            rewritten += remapped.is(bytes) ? 0 : 1
                            bytes = remapped
                        } else if (entry.name.endsWith('refmap.json') || entry.name.endsWith('accesstransformer.cfg')) {
                            String text = new String(bytes, 'UTF-8')
                            String renamed = text.replaceAll(srg) { String match -> names.getOrDefault(match, match) }
                            rewritten += renamed == text ? 0 : 1
                            bytes = renamed.getBytes('UTF-8')
                        }
                        out.putNextEntry(new java.util.zip.ZipEntry(entry.name))
                        out.write(bytes)
                        out.closeEntry()
                    }
                }
            }
            logger.lifecycle("remapDevMods: ${source.name} -> ${target.name} (${rewritten} entries rewritten)")
        }
    }
}
// ---------------------------------------------------------------------------------------------

/**
 * Adds libs/&lt;name&gt; to the dev run classpath if it is present, skipping it with one line otherwise.
 * libs/ is gitignored (those jars are All Rights Reserved and must not be redistributed), so a
 * fresh clone has none of them and must still build -- absence is the normal case, not an error.
 */
def devMod(String jarName, boolean byDefault) {
    if (!byDefault && !project.hasProperty('devExtraMods')) {
        return
    }
    def jar = file("libs/${jarName}")
    if (jar.exists()) {
        dependencies.add('devModSource', files(jar))
        logger.lifecycle("dev run will include ${jarName}")
    } else {
        logger.info("libs/${jarName} not present; dev runs will not include it.")
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // MCA Reborn -- obfuscated production (Universal) jar, remapped to dev mappings by fg.deobf.
    //
    // runtimeOnly, NOT implementation. No class in src/main/java names an MCA type: MCA villagers
    // are identified by their entity-type registry ids, and every behaviour this mod implements
    // reaches them through vanilla APIs (VillagerEntityMCA extends net.minecraft...npc.Villager).
    // NoOptionalModStaticLinkTest fails the build if a compile-time reference ever appears.
    //
    // -PmcaDev77 launches the 7.7 line (package root forge.net.conczin.mca, registry-backed
    // personalities) instead, which is how McaBinding is checked against both layouts it supports.
    //
    // Not through fg.deobf: MCA is built with Loom and Forgix, and its mixins name Minecraft members
    // by SRG name in their annotations with no refmap, which fg.deobf does not touch and which a dev
    // runtime therefore cannot apply. remapDevMods (below) rewrites every SRG member name in a
    // copy of the jar -- annotations included -- to the official names a dev run uses.
    devModSource "maven.modrinth:minecraft-comes-alive-reborn:${mcaDevVersion}"
    if (!project.hasProperty('mcaDev77')) {
        // Architectury API (Forge) -- MCA 7.6's Forge build needs it on the dev run classpath. This
        // mod names not one Architectury symbol, so it is never a compile dependency: an accidental
        // `import dev.architectury.*` stays a compile error. (MCA 7.7 drops Architectury, which is
        // why mods.toml does not declare it.)
        devModSource "dev.architectury:architectury-forge:${architectury_version}"
    }

    // Optional mods and their libraries, for dev runs and GameTests only, one flag per mod. Pinned
    // in gradle.properties; runtime-only so that nothing can ever compile against them.
    if (project.hasProperty('withSwem') || project.hasProperty('withIcy') || project.hasProperty('withCrime')) {
        devModSource "maven.modrinth:geckolib:${dev_geckolib_version}"
    }
    if (project.hasProperty('withSwem')) {
        devModSource "maven.modrinth:playeranimator:${dev_playeranimator_version}"
    }
    if (project.hasProperty('withIcy')) {
        devModSource "maven.modrinth:patchouli:${dev_patchouli_version}"
        devModSource "maven.modrinth:icys-better-horses:${dev_icys_better_horses_version}"
    }
    if (project.hasProperty('withAlex')) {
        devModSource "maven.modrinth:citadel:${dev_citadel_version}"
        devModSource "maven.modrinth:alexs-mobs:${dev_alexsmobs_version}"
    }
    if (project.hasProperty('withGolems')) {
        devModSource "maven.modrinth:golemskillcreepers:${dev_golemskillcreepers_version}"
    }
    // Villager Recruits, and Villager Workers on top of it (Workers requires Recruits), for the
    // native-character GameTests. Pinned by Modrinth version id to the audited releases.
    if (project.hasProperty('withRecruits') || project.hasProperty('withWorkers')) {
        devModSource "maven.modrinth:villager-recruits:${dev_recruits_version}"
    }
    if (project.hasProperty('withWorkers')) {
        devModSource "maven.modrinth:villager-workers:${dev_workers_version}"
    }
    // MCA: Crime is not on Modrinth in the version the effect mirror targets, so -PwithCrime takes a
    // built jar: -PcrimeJar=<path to mcacrime-<version>.jar> (its Forge 1.20.1 release jar). It runs the
    // mcamobcompat_crime suite, which checks that Crime's effects on a hidden proxy reach the guard.
    if (project.hasProperty('withCrime')) {
        def crimeJar = file(project.findProperty('crimeJar') ?: '')
        if (!crimeJar.isFile()) {
            throw new GradleException("-PwithCrime needs -PcrimeJar=<path to a built MCA: Crime jar>; got '${crimeJar}'.")
        }
        devModSource files(crimeJar)
    }
    runtimeOnly files({ configurations.devModSource.files.collect { File source ->
        devModsDir.get().file(source.name.replaceAll(/\.jar$/, '-dev.jar')).asFile } }).builtBy('remapDevMods')

    mcaProbeVersions.eachWithIndex { version, i ->
        add("mcaProbe${i}", "maven.modrinth:minecraft-comes-alive-reborn:${version}")
    }
    nativeModProbe "maven.modrinth:villager-recruits:${dev_recruits_version}"
    nativeModProbe "maven.modrinth:villager-workers:${dev_workers_version}"

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Optional mods for dev runs only. Nothing here is ever a compile dependency: the whole point of
// this mod's architecture is that it references no optional mod's classes at all (enforced by
// NoOptionalModStaticLinkTest), so these exist purely so `runClient` has something real to exercise
// the handlers against.
//
// Guard Villagers is included by default because its only dependencies are Forge and Minecraft, and
// because every safety-critical behaviour is about it. SWEM is not on Modrinth for 1.20.1, so its
// jar comes from libs/ under -PwithSwem, with GeckoLib and PlayerAnimator fetched above. Genetic
// Animals and DLO stay opt-in via -PdevExtraMods=true and are meant for a real instance via
// `gradlew installMod`.
devMod('guardvillagers-1.20.1-1.6.19.jar', true)
devMod('swem-1.20.1-1.6.6.jar', project.hasProperty('withSwem'))
devMod('eanimod-0_11_9.jar', false)
devMod('DragNs_Livestock_Overhaul-1.20.1-3.9.4.jar', false)

test {
    useJUnitPlatform()
    // The file-reading tests resolve paths against this, so they work from any working directory.
    systemProperty 'mcamobcompat.projectDir', projectDir.absolutePath
    // The MCA jars travel as paths, not a classpath: McaBindingProbeTest opens each in its own
    // URLClassLoader behind a parent that hides the remapped dev MCA this classpath carries. Declared
    // as inputs so a fleet change re-runs the suite; the property itself is set in doFirst, not at
    // configuration time, so the repositories are not frozen before every dependency is registered.
    inputs.files(mcaProbeVersions.indices.collect { i -> configurations.getByName("mcaProbe${i}") })
            .withPropertyName('mcaProbeJars')
    inputs.files(configurations.nativeModProbe).withPropertyName('nativeModProbeJars')
    doFirst {
        systemProperty 'mcamobcompat.probe.recruits', configurations.nativeModProbe.files
                .findAll { it.name.contains('recruits') }.join(File.pathSeparator)
        systemProperty 'mcamobcompat.probe.workers', configurations.nativeModProbe.files
                .findAll { it.name.contains('workers') }.join(File.pathSeparator)
        systemProperty 'mcamobcompat.probe.jars', mcaProbeVersions.indices
                .collect { i -> configurations.getByName("mcaProbe${i}").files }
                .flatten()
                .findAll { it.name.contains('minecraft-comes-alive') }
                .join(File.pathSeparator)
    }
}

// Expand metadata placeholders into mods.toml / pack.mcmeta at build time.
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: project.version.toString(),
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                // The optional hooks. Every injection in it is optional and string-targeted; see
                // hook.HookPlugin for how an injection that found nothing is told apart from one that landed.
                'MixinConfigs'            : 'mcamobcompat.mixins.json'
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

/**
 * The shipped artifact must not contain a single class from MCA or from any optional mod. This mod
 * declares no compile dependency on any of them, so anything under these roots means a dependency
 * scope was written wrong or a shadow/jarjar step crept in.
 *
 * <p>Matching is on the entry path prefix, so our own resources under data/mcamobcompat/ are
 * unaffected.
 *
 * <p>It then byte-scans our own classes for MCA package roots in both slash and dotted form, with a
 * single-class allowlist for the reflective binding layer. That duplicates
 * NoOptionalModStaticLinkTest deliberately: this gate reads the finished artifact and still runs
 * under `-x test`, and it is the last thing between a build and `installMod`. Keep the two lists in
 * step -- src/test/java/dev/otectus/mcamobcompat/NoOptionalModStaticLinkTest.java.
 */
tasks.register('checkJarContents') {
    dependsOn tasks.named('jar')
    doLast {
        def forbidden = ['tallestegg/guardvillagers/', 'com/alaharranhonor/swem/',
                         'mokiyoki/enhancedanimals/', 'com/dragn0007/dragnlivestock/',
                         'icy/betterhorses/', 'com/github/alexthe666/', 'codx/codxlib/',
                         'dev/terminalmc/golemskillcreepers/', 'com/talhanation/',
                         'forge/net/mca/', 'net/mca/', 'forge/net/conczin/mca/',
                         'net/conczin/mca/', 'dev/architectury/',
                         // The GameTest mod is its own source set and must never reach this jar.
                         'dev/otectus/mcamobcompat/gametest/']
        // Slash form is a real class reference, and no class may hold one, allowlisted or not.
        def forbiddenBytes = ['forge/net/mca', 'net/conczin/mca', 'net/mca/',
                              'tallestegg/guardvillagers', 'com/alaharranhonor/swem',
                              'mokiyoki/enhancedanimals', 'com/dragn0007/dragnlivestock',
                              'icy/betterhorses', 'com/github/alexthe666', 'codx/codxlib',
                              'dev/terminalmc/golemskillcreepers', 'dev/architectury', 'com/talhanation',
                              // Optional mods' dotted names that no class may hold at all.
                              'tallestegg.guardvillagers', 'com.alaharranhonor.swem',
                              'mokiyoki.enhancedanimals', 'com.dragn0007', 'icy.betterhorses',
                              'com.github.alexthe666', 'codx.codxlib', 'dev.terminalmc.golemskillcreepers',
                              'dev.architectury']
        // Dotted form is a Class.forName or Mixin target name. Each root may appear only in the exact
        // class files listed -- the reflective bindings and the optional hooks -- and no prefix matches.
        def dottedAllowlist = [
                'forge.net.mca'           : ['dev/otectus/mcamobcompat/mca/McaBinding.class',
                                             'dev/otectus/mcamobcompat/hook/mixin/McaEditorSaveHook.class'],
                'net.conczin.mca'         : ['dev/otectus/mcamobcompat/mca/McaBinding.class',
                                             'dev/otectus/mcamobcompat/hook/mixin/McaEditorSaveHook.class'],
                'net.mca.'                : ['dev/otectus/mcamobcompat/mca/McaBinding.class',
                                             'dev/otectus/mcamobcompat/hook/mixin/McaEditorSaveHook.class'],
                'com.talhanation.recruits': ['dev/otectus/mcamobcompat/integration/recruits/RecruitsBinding.class',
                                             'dev/otectus/mcamobcompat/hook/mixin/RecruitsConversionHook.class'],
                'com.talhanation.workers' : ['dev/otectus/mcamobcompat/integration/workers/WorkersBinding.class'],
        ]
        def allowlisted = dottedAllowlist.values().flatten() as Set

        def jarFile = tasks.named('jar').get().archiveFile.get().asFile
        def offenders = []
        def linked = []
        def allowlistSeen = [] as Set
        new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
            zip.entries().each { entry ->
                if (forbidden.any { entry.name.startsWith(it) }) {
                    offenders << entry.name
                }
                if (entry.name.startsWith('dev/otectus/mcamobcompat/') && entry.name.endsWith('.class')) {
                    def text = new String(zip.getInputStream(entry).bytes, 'ISO-8859-1')
                    if (allowlisted.contains(entry.name)) {
                        allowlistSeen << entry.name
                    }
                    forbiddenBytes.each { root ->
                        if (text.contains(root)) {
                            linked << "${entry.name} -> ${root}"
                        }
                    }
                    dottedAllowlist.each { root, classes ->
                        if (text.contains(root) && !classes.contains(entry.name)) {
                            linked << "${entry.name} -> ${root}"
                        }
                    }
                }
            }
        }
        if (!offenders.isEmpty()) {
            throw new GradleException("Shaded classes found in ${jarFile.name}: ${offenders.take(20)}")
        }
        if (!linked.isEmpty()) {
            throw new GradleException("Class(es) in ${jarFile.name} name MCA or an optional mod: "
                    + "${linked.take(20)}. Reflective access and hook targets belong in the allowlisted "
                    + "classes alone; see NoOptionalModStaticLinkTest.")
        }
        // A dead exemption is worse than none: it would silently cover nothing while looking safe.
        def missing = allowlisted - allowlistSeen
        if (!missing.isEmpty()) {
            throw new GradleException("Allowlisted class(es) missing from ${jarFile.name}: ${missing}. "
                    + "Update both this list and NoOptionalModStaticLinkTest.DOTTED_ALLOWLIST.")
        }
        logger.lifecycle("checkJarContents: ${jarFile.name} is clean (no shaded MCA/optional-mod classes, "
                + "no foreign package names outside the ${allowlisted.size()}-class allowlist).")
    }
}

// ForgeGradle reobfuscates in place, so between `jar` and `reobfJar` the archive at
// build/libs/mcamobcompat-forge-<version>.jar still names Minecraft's members by their official (dev-only)
// names, which no production runtime knows. Such a jar looks completely normal and then dies the
// instant one of our classes touches Minecraft. Both tasks below therefore run after reobfJar and
// read the finished artifact, and `installMod` exists so copying it by hand is unnecessary.
tasks.register('verifyReobfJar') {
    group = 'verification'
    description = 'Fails if the built jar still names Minecraft members by their official (dev-only) names.'
    dependsOn 'reobfJar'
    def builtJar = tasks.named('jar', Jar).flatMap { it.archiveFile }
    inputs.file(builtJar)
    doLast {
        def jarPath = builtJar.get().asFile
        int srgRefs = 0
        new java.util.zip.ZipFile(jarPath).withCloseable { zip ->
            zip.entries().each { entry ->
                if (!entry.name.endsWith('.class')) {
                    return
                }
                // Constant-pool UTF8 entries are raw bytes; ISO-8859-1 round-trips them, and an SRG
                // member name (m_12345_ / f_12345_) is plain ASCII, so a text scan is enough.
                def text = new String(zip.getInputStream(entry).bytes, 'ISO-8859-1')
                if (text =~ /[mf]_\d+_/) {
                    srgRefs++
                }
            }
        }
        if (srgRefs == 0) {
            throw new GradleException("${jarPath.name} names no Minecraft member by its SRG name, so it was " +
                    "never reobfuscated. Installing it would fail at class-init. Run `gradlew build` to " +
                    "completion and install build/libs/${jarPath.name} (or use `gradlew installMod`).")
        }
        logger.lifecycle("${jarPath.name}: reobfuscated (${srgRefs} classes carry SRG member names).")
    }
}

// Checks what the finished artifact contains, the way a player's instance will see it: metadata
// expanded, every shipped tag and resource present, nothing from the test or probe source sets,
// Java 17 class files, and no NeoForge reference. The NeoForge build runs the same checks against its
// own layout, so the two releases are held to one standard.
tasks.register('verifyProductionJar') {
    group = 'verification'
    description = 'Fails if the built jar is missing shipped resources or carries anything it must not.'
    dependsOn 'reobfJar'
    def builtJar = tasks.named('jar', Jar).flatMap { it.archiveFile }
    inputs.file(builtJar)
    doLast {
        def jarFile = builtJar.get().asFile
        new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
            def meta = zip.getEntry('META-INF/mods.toml')
            if (meta == null) {
                throw new GradleException("${jarFile.name} has no META-INF/mods.toml")
            }
            def text = zip.getInputStream(meta).getText('UTF-8')
            if (text.contains('$' + '{') || !text.contains(project.version.toString()) || !text.contains('modId="forge"')) {
                throw new GradleException("${jarFile.name}: META-INF/mods.toml is unexpanded or names the wrong version/loader")
            }
            ['cattle', 'guard', 'horse', 'humanoid_npc', 'livestock', 'mca_villagers', 'mount', 'npc_threats',
             'pet', 'pig', 'player_only_mounts', 'poultry', 'sheep'].each {
                if (zip.getEntry("data/mcamobcompat/tags/entity_types/${it}.json") == null) {
                    throw new GradleException("${jarFile.name} is missing the entity tag ${it}")
                }
            }
            ['assets/mcamobcompat/lang/en_us.json', 'pack.mcmeta', 'mcamobcompat.mixins.json',
             'dev/otectus/mcamobcompat/hook/mixin/McaEditorSaveHook.class',
             'dev/otectus/mcamobcompat/hook/mixin/RecruitsConversionHook.class',
             'dev/otectus/mcamobcompat/hook/HookPlugin.class'].each {
                if (zip.getEntry(it) == null) {
                    throw new GradleException("${jarFile.name} is missing ${it}")
                }
            }
            def manifest = zip.getInputStream(zip.getEntry('META-INF/MANIFEST.MF')).getText('UTF-8')
            if (!manifest.contains('MixinConfigs: mcamobcompat.mixins.json')) {
                throw new GradleException("${jarFile.name} does not declare its hook config (MixinConfigs)")
            }
            def hooks = zip.getInputStream(zip.getEntry('mcamobcompat.mixins.json')).getText('UTF-8')
            if (hooks.contains('"refmap"') || !hooks.contains('"required": false')) {
                throw new GradleException("mcamobcompat.mixins.json must be optional and need no refmap")
            }
            zip.entries().each { entry ->
                if (entry.name.endsWith('.jar') || entry.name.contains('tags/entity_type/')
                        || entry.name == 'META-INF/neoforge.mods.toml' || entry.name.contains('/gametest/')
                        || entry.name.contains('/probe/') || entry.name.endsWith('Test.class')) {
                    throw new GradleException("Unexpected production entry ${entry.name} in ${jarFile.name}")
                }
                if (entry.name.endsWith('.class')) {
                    byte[] bytes = zip.getInputStream(entry).bytes
                    int major = (bytes[6] & 255) * 256 + (bytes[7] & 255)
                    if (major != 61) {
                        throw new GradleException("${entry.name} is not a Java 17 class (major ${major})")
                    }
                    def symbols = new String(bytes, 'ISO-8859-1')
                    if (symbols.contains('net/neoforged') || symbols.contains('net.neoforged')) {
                        throw new GradleException("${entry.name} references NeoForge")
                    }
                }
            }
        }
        logger.lifecycle("Verified production jar: ${jarFile.name}")
    }
}

// Installs the finished jar into a mods folder, so nobody has to copy build/libs by hand and race
// reobfJar for it. Nothing is deleted, but an older mcamobcompat jar left behind is called out,
// because two of them in one folder is a duplicate-mod error rather than an upgrade.
tasks.register('installMod') {
    group = 'build'
    description = 'Copies the verified, reobfuscated jar into -PmodsDir=<dir> (or $MCAMOBCOMPAT_MODS_DIR).'
    dependsOn 'checkJarContents', 'verifyReobfJar', 'verifyProductionJar'
    def builtJar = tasks.named('jar', Jar).flatMap { it.archiveFile }
    def target = (project.findProperty('modsDir') ?: System.getenv('MCAMOBCOMPAT_MODS_DIR'))?.toString()
    inputs.file(builtJar)
    doLast {
        if (!target) {
            throw new GradleException("No mods folder given. Pass -PmodsDir=<path to your instance's mods " +
                    "folder> or set the MCAMOBCOMPAT_MODS_DIR environment variable.")
        }
        def modsDir = file(target)
        if (!modsDir.isDirectory()) {
            throw new GradleException("Mods folder does not exist: ${modsDir}")
        }
        def source = builtJar.get().asFile
        modsDir.listFiles({ f -> f.name ==~ /^${mod_id}-.*\.jar$/ && f.name != source.name } as FileFilter)
                ?.each { logger.warn("WARNING: ${it.name} is still in ${modsDir}; remove it, or Forge will refuse " +
                        "to load two copies of ${mod_id}.") }
        java.nio.file.Files.copy(source.toPath(), new File(modsDir, source.name).toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        logger.lifecycle("Installed ${source.name} to ${modsDir}.")
    }
}

// A GameTest server that fails to start -- a missing dependency, a mixin error -- still exits 0,
// which would pass for a green run. So the run is judged by the server's own summary line instead.
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doLast {
        def log = file('run-gametest/logs/latest.log')
        if (!log.exists()) {
            throw new GradleException("No GameTest log at ${log}; the server did not start.")
        }
        def text = log.getText('UTF-8')
        def passed = text =~ /All (\d+) required tests passed/
        if (!passed.find()) {
            def failed = text =~ /(\d+) required tests failed/
            throw new GradleException(failed.find()
                    ? "${failed.group(1)} required GameTest(s) failed; see ${log}."
                    : "The GameTest server never reported a result (did it fail to load?); see ${log}.")
        }
        logger.lifecycle("GameTests: all ${passed.group(1)} required tests passed.")
    }
}

tasks.named('build').configure {
    dependsOn 'checkJarContents', 'verifyReobfJar', 'verifyProductionJar'
}

// Optional, separately packaged validation driver. Never included by build, jar, or installMod.
// Reobfuscated like the release jar, because it runs on the same production (SRG-named) runtime.
tasks.register('runtimeProbeJar', Jar) {
    archiveClassifier = 'runtime-probe'
    from sourceSets.runtimeProbe.output
    finalizedBy 'reobfRuntimeProbeJar'
}
reobf {
    runtimeProbeJar {}
}
