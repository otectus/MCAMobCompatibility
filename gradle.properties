# Memory for the Minecraft decompile/setup. Daemon off to avoid stale-JDK daemons.
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=false
# The JDK is NOT pinned here on purpose. build.gradle sets
# java.toolchain.languageVersion = 17 and settings.gradle applies the foojay resolver, so
# Gradle finds (or fetches) a JDK 17 on any machine. An absolute org.gradle.java.home makes
# the build unusable on every other developer's box.

## Minecraft / Forge
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.10
forge_version_range=[47,)
loader_version_range=[47,)
mapping_channel=official
mapping_version=1.20.1

## Dependencies
# MCA Reborn for 1.20.1 Forge, via Modrinth Maven (accepts the version string directly).
#
# RUNTIME ONLY. MCA villagers are identified by their entity-type registry ids
# (mca:male_villager / mca:female_villager), and the few MCA members this mod needs are bound by
# name in mca/McaBinding, which probes both the net.mca and net.conczin.mca layouts. This version is
# only what dev runClient/runServer/runGameTestServer launch with; it is not a compile dependency and
# it does not pin the mod. Pass -PmcaDev77 to launch against the 7.7 line instead.
mca_version_77=7.7.1-alpha.2+1.20.1
mca_version=7.6.20+1.20.1
# Architectury API (Forge) -- hard runtime requirement of MCA 7.6's Forge build.
architectury_version=9.2.14

## Dev-only optional mods, fetched only with the matching -Pwith* flag and only onto the dev run
## classpath. None is a compile dependency and none is shipped. Pinned by Modrinth *version id*, not
## version number: several of these publish one version number per loader, and a number can resolve
## to a Fabric or NeoForge file. Each comment names the Forge 1.20.1 file the id resolves to.
## SWEM 1.20.1 is not on Modrinth: its jar is read from libs/ (gitignored, All Rights Reserved).
# geckolib-forge-1.20.1-4.8.4.jar
dev_geckolib_version=aC5KMoNg
# player-animation-lib-forge-1.0.2-rc1+1.20.jar
dev_playeranimator_version=xe2EVE6q
# Patchouli-1.20.1-85-FORGE.jar
dev_patchouli_version=94dtOLgZ
# citadel-2.6.3-1.20.1.jar
dev_citadel_version=lTAAe4sZ
# alexsmobs-1.22.9.jar
dev_alexsmobs_version=XoIASRVU
# icys-better-horses-1.1.6.jar (Forge)
dev_icys_better_horses_version=M2ySgx5C
# golemskillcreepers-forge-1.0.0+1.20.1.jar
dev_golemskillcreepers_version=5A4SVFRo

## Mod metadata
mod_id=mcamobcompat
mod_name=MCA: Mob Compatibility
# GPL-3.0 to match the rest of the MCA addon suite. See the LICENSE file.
mod_license=GPL-3.0-only
mod_version=0.2.1
mod_group_id=dev.otectus.mcamobcompat
mod_authors=otectus
mod_description=Semantic entity classification that teaches Minecraft Comes Alive: Reborn to recognise modded animals, mounts, livestock and guards -- and stops Guard Villagers destroying MCA villagers.
